name: TestFlight

# Uploads a new build to TestFlight on every push to main.
# Can also be triggered manually from the Actions tab.
#
# Required repository secrets:
#   BUILD_CERTIFICATE_BASE64        - Apple Distribution certificate (.p12) encoded as base64
#   P12_PASSWORD                    - Password for the .p12 certificate
#   BUILD_PROVISION_PROFILE_BASE64  - App Store provisioning profile (.mobileprovision) encoded as base64
#   KEYCHAIN_PASSWORD               - Arbitrary password used for the temporary CI keychain
#   APP_STORE_CONNECT_API_KEY_ID    - App Store Connect API key ID (e.g. ABC1234567)
#   APP_STORE_CONNECT_API_ISSUER_ID - App Store Connect API issuer UUID
#   APP_STORE_CONNECT_API_PRIVATE_KEY - Contents of the .p8 API private key file
#
# How to encode files as base64:
#   base64 -i Certificate.p12 | pbcopy
#   base64 -i DigiFox_AppStore.mobileprovision | pbcopy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      # ── Code signing setup ──────────────────────────────────────────────────

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      # ── Set build number to the GitHub run number ───────────────────────────

      - name: Set build number
        run: |
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion ${{ github.run_number }}" \
            DigiFox/Info.plist

      # ── Build & archive ─────────────────────────────────────────────────────

      - name: Build archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DigiFox.xcodeproj \
            -scheme DigiFox \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/DigiFox.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=C28S8EFBAD \
            | xcpretty

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DigiFox.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      # ── Upload to TestFlight ────────────────────────────────────────────────

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          # xcrun altool is deprecated as of Xcode 15 but remains functional through Xcode 16.
          # To migrate in future: replace with a direct App Store Connect API call or fastlane pilot.
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_PRIVATE_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/DigiFox.ipa" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      # ── Cleanup ─────────────────────────────────────────────────────────────

      - name: Clean up keychain and provisioning profile
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          # Remove the provisioning profile we copied (same basename as our temp file)
          rm -f "$RUNNER_TEMP/build_pp.mobileprovision" || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision || true
